# 아이폰 빌드 → TestFlight (Mac 없이 GitHub의 Mac 서버에서 서명·업로드)
#
# 흐름: Windows에서 Unity로 Xcode 프로젝트를 만들고(WordRPG > Build > iOS Xcode 프로젝트)
#       python Tools/zip_ios_for_mac.py 로 묶은 zip을 태그 'ios-build-…' 릴리스에 붙여 올리면 시작된다.
#         gh release create ios-build-0.1-1 Builds/WordRPG-iOS-0.1-build1.zip --prerelease --title "iOS 빌드 0.1 (1)"
#       → 서명 없이 Archive → 애플 클라우드 서명(API 키)으로 내보내며 바로 앱스토어 커넥트에 업로드 → 릴리스(큰 zip) 삭제
# 빌드 번호는 업로드할 때 Xcode가 다음 번호로 자동으로 올린다 (manageAppVersionAndBuildNumber)
#
# 필요한 비밀값 (저장소 Settings > Secrets and variables > Actions):
#   APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_P8(.p8 파일 내용 전체), APPLE_TEAM_ID(10자리 팀 ID)
name: iOS TestFlight

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Xcode 프로젝트 zip이 붙은 릴리스 태그 (예: ios-build-0.1-1)"
        required: true

permissions:
  contents: write # 업로드가 끝나면 릴리스(큰 zip)를 지운다

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'ios-build-')
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: 비밀값 확인
        env:
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          missing=""
          [ -n "$KEY_ID" ] || missing="$missing APPSTORE_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing APPSTORE_ISSUER_ID"
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$KEY_P8" ] || missing="$missing APPSTORE_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::비밀값이 없어요:$missing"; exit 1; fi

      - name: Xcode 최신 안정판
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode 프로젝트 받기
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'WordRPG-iOS-*.zip' --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          unzip -q WordRPG-iOS-*.zip   # zip에 들어 있는 실행 권한(755)이 그대로 풀린다
          ls -l WordRPG-iOS/process_symbols.sh

      - name: API 키 파일
        env:
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"

      - name: Archive (서명 없이)
        working-directory: ${{ runner.temp }}/WordRPG-iOS
        run: |
          xcodebuild -version
          xcodebuild -quiet -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/WordRPG.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive

      - name: 서명하고 TestFlight에 올리기
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><true/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/WordRPG.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"

      - name: 실패하면 Xcode 로그 남기기
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          find "$TMPDIR" /var/folders -name "*.xcdistributionlogs" -maxdepth 6 -exec cp -R {} "$RUNNER_TEMP/logs/" \; 2>/dev/null || true
          ls -R "$RUNNER_TEMP/logs" | head -50

      - name: 로그 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: ${{ runner.temp }}/logs
          if-no-files-found: ignore

      - name: 다 올렸으면 릴리스(zip) 지우기
        if: success()
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
